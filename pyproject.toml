[project]
name = "bosscigar"
version = "0.1.0"
description = "Pipeline de dados do Boss Cigar: base de dados de charutos com mapa, harmonizações e enriquecimento aberto"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.5",
  "pyyaml>=6",
  "requests>=2.31",
  "duckdb>=1.0",
  "pyarrow>=15",
  "pandas>=2.1",
  "odfpy>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
