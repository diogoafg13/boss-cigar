name: build-and-deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"   # segundas-feiras ~07:17 (Lisboa)
  workflow_dispatch:

permissions:
  contents: write     # commit do cache e dos dados limpos
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04   # fixo: o ubuntu-latest muda para 26 em out. 2026
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        run: pip install -e ".[dev]"

      - name: Testes
        run: pytest -q

      - name: Validar seed
        run: python -m bosscigar validate

      - name: Recuperar dados publicados como cache (fontes sem cache no repositório)
        run: |
          mkdir -p data/cache
          if [ ! -s data/cache/osm_shops_pt.json ]; then
            curl -fsS -m 30 "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/shops.json" -o /tmp/shops.json \
              && python -c "import json; d=json.load(open('/tmp/shops.json')).get('shops') or []; d and json.dump(d, open('data/cache/osm_shops_pt.json','w'), ensure_ascii=False)" \
              || echo "sem versão publicada das tabacarias"
          fi

      - name: Construir dados (fontes abertas, com fallback para cache)
        run: python -m bosscigar build

      - name: Notificações push (opcional, secret NTFY_TOPIC)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m bosscigar.notify

      - name: Guardar cache e dados limpos no repositório
        if: github.ref == 'refs/heads/main'
        continue-on-error: true   # sem permissão de escrita, o site publica na mesma
        run: |
          git config user.name  "boss-cigar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/cache data/clean site/data
          git diff --cached --quiet || git commit -m "chore(data): atualiza cache e dados limpos [skip ci]"
          git pull --rebase --autostash origin main
          git push

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04   # fixo: o ubuntu-latest muda para 26 em out. 2026
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
